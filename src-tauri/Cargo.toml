[package]
name = "spotify-floating-lyrics"
version = "0.2.0"
description = "Floating, time-synced lyrics for whatever Spotify is playing"
authors = ["harispraba"]
license = "MIT"
repository = "https://github.com/harispraba/spotify-floating-lyrics"
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "spotify_floating_lyrics_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "macos-private-api"] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-window-state = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
# native-tls uses the OS TLS stack on Windows/macOS (and OpenSSL on Linux).
reqwest = { version = "0.13", default-features = false, features = ["native-tls", "json", "query", "system-proxy"] }
tokio = { version = "1", features = ["time"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = ["Media_Control", "Foundation", "Foundation_Collections"] }

[target.'cfg(target_os = "linux")'.dependencies]
zbus = "5"


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
