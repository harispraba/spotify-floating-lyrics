name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  windows:
    name: Windows installers
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Check the tag matches the version everywhere
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME#v}"
          npm_version=$(node -p "require('./package.json').version")
          tauri_version=$(node -p "require('./src-tauri/tauri.conf.json').version")
          cargo_version=$(sed -n 's/^version = "\(.*\)"/\1/p' src-tauri/Cargo.toml | head -1)
          echo "tag $tag, package.json $npm_version, tauri.conf.json $tauri_version, Cargo.toml $cargo_version"
          if [ "$tag" != "$npm_version" ] || [ "$tag" != "$tauri_version" ] || [ "$tag" != "$cargo_version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME doesn't match the version in package.json, tauri.conf.json and Cargo.toml"
            exit 1
          fi

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      # Builds the NSIS and MSI installers and attaches them to a draft release,
      # which is published by hand after the download has been tried.
      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: Spotify Floating Lyrics ${{ github.ref_name }}
          releaseDraft: true
          generateReleaseNotes: true
          releaseBody: |
            Windows 10 and 11 installers. Pick one:

            - **`…x64-setup.exe`**: the usual installer. It installs for your account only, so it doesn't need admin rights.
            - **`…x64_en-US.msi`**: for managed or scripted installs.

            The installers aren't code-signed yet, so SmartScreen may say "Windows protected your PC". Choose **More info**, then **Run anyway**.

            The app needs the Spotify desktop app on the same computer. Linux and macOS builds aren't available yet.
